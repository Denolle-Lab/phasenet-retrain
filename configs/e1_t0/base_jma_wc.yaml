# E1 / 46B, arm `base_jma_wc`, seed 0: the base recipe from the second parent
#  `jma_wc` (PhaseNetWC width, SeisBench norm std). Differs from base.yaml
#  in model.pretrained.model_name and, because the normalisation follows
#  the parent, data.norm ("std" here, "peak" for `instance`). Not one of the
#  seven E1 arms; it brackets the initialisation question until E4.
#  Everything else is the base recipe of base.yaml (instance init, 34A loader,
#  masked policy, soft CE, alpha 0, adaptive BN, AdamW 5e-6, wd 1e-4, batch 256,
#  warm-up 2 then cosine to 1e-6, clip 1.0, val_loss patience 10, 60 epochs,
#  crop/jitter/flip only). Seeds 1 and 2: scripts/e1_seed_configs.py.

model:
  pretrained:
    use_pretrained: true
    model_name: "jma_wc"
    freeze_layers: []

training:
  batch_size: 256
  num_workers: 16
  max_epochs: 60
  learning_rate: 0.000005
  optimizer: "adamw"
  weight_decay: 0.0001

  distillation:
    alpha: 0.0
    temperature: 4.0

  soft_ce: true
  freeze_bn_stats: false
  timing_beta: 0.0
  presence_gamma: 0.0
  focal_gamma: 0.0

  scheduler:
    name: "CosineAnnealingWarmup"
    warmup_epochs: 2
    min_lr: 1.0e-6
    warmup_start_factor: 0.01

  early_stopping:
    monitor: "val_loss"
    patience: 10
    mode: "min"

  gradient_clip_val: 1.0
  accumulate_grad_batches: 1

data:
  train_manifest: "data/manifests_t0/train.csv"
  val_manifest:   "data/manifests_t0/val.csv"
  test_manifest:  "data/manifests_t0/test.csv"
  window_length: 3001
  label_policy: "masked"
  norm: "std"                  # window normalisation follows the parent (SeisBench model_args.norm)
  augmentation:
    noise_prob: 0.0

logging:
  use_tensorboard: false
  use_wandb: false
  log_every_n_steps: 100
  save_dir: "results"
  run_name: "e1_t0_base_jma_wc_seed0"
  checkpoint_dir: "checkpoints/e1_t0_base_jma_wc_seed0"
  metrics_csv: "results/e1_t0_base_jma_wc_seed0_metrics.csv"

hardware:
  accelerator: "auto"
  devices: 1
  amp: true

seed: 0
